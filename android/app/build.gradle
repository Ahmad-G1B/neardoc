plugins { id 'com.android.application' }

android {
    namespace 'com.locallink.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.locallink.android'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.7.0'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// A legacy compatibility pair is present in this Mac's shared Gradle cache. Modern Kotlin
// stdlib already includes these APIs, so carrying the old artifacts produces duplicate classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
